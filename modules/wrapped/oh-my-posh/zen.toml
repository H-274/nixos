version = 2
final_space = true
console_title_template = "{{ .Shell }} in {{ .Folder }}"
shell_integration = true

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "path"
style = "plain"
background = "transparent"
foreground = "p:blue"
template = "{{ .Path }}"

[blocks.segments.properties]
style = "full"

[[blocks.segments]]
type = "git"
style = "plain"
foreground = "p:subtext-0"
background = "transparent"
template = " {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <p:sky>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>"

[blocks.segments.properties]
branch_icon = ""
commit_icon = "@"
fetch_status = true

[[blocks]]
type = "rprompt"
overflow = "hidden"

[[blocks.segments]]
type = "executiontime"
style = "plain"
foreground = "p:yellow"
background = "transparent"
template = "{{ .FormattedMs }}"

[blocks.segments.properties]
threshold = 5000

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
foreground = "p:green"
style = "plain"
template = "{{ .UserName }}@{{ .HostName }}"
type = "session"

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "p:mauve"
background = "transparent"
template = " ❯"

[transient_prompt]
foreground_templates = [
    "{{if gt .Code 0}}p:red{{end}}",
    "{{if eq .Code 0}}p:mauve{{end}}",
]
background = "transparent"
template = "❯ "

[secondary_prompt]
foreground_templates = [
    "{{if gt .Code 0}}p:red{{end}}",
    "{{if eq .Code 0}}p:mauve{{end}}",
]
background = "transparent"
template = "❯❯ "


[palette]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavander = "#b4befe"
text = "#cdd6f4"
subtext-1 = "#bac2de"
subtext-0 = "#a6adc8"
overlay-2 = "#9399b2"
overlay-1 = "#7f849c"
overlay-0 = "#6c7086"
surface-2 = "#585b70"
surface-1 = "#45475a"
surface-0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
